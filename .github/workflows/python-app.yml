name: Python tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test]"
    - name: Lint with flake8
      run: |
        python -m flake8 src tests examples tools --count --select=E9,F63,F7,F82 --show-source --statistics
        python -m flake8 src --count --select=F401,F811,F841 --show-source --statistics
    - name: Test with pytest
      run: python -m pytest
    - name: Check deployment regression scenarios
      run: python examples/run_extended_matrix.py
