[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferfit"
dynamic = ["version"]
description = "Engine-aware memory preflight and parallelism planning for LLM inference"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{name = "InferFit contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "flake8>=7,<8"]

[project.scripts]
inferfit = "inferfit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["inferfit*"]

[tool.setuptools.package-data]
inferfit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "inferfit._version.__version__"}
